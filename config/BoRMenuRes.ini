; Beast of Reincarnation - Sharp Menu Model and Logo Skip: settings
;
; To change a setting, edit the value after the "=", save this file and restart the game.
; true = on, false = off. A deleted line (or a deleted file) means the default shown here.

[General]
; Turns the whole mod on or off.
Enabled = true

[Preview]
; A sharper character model in the equipment menu (the game draws it at only 1024 x 1024).
Resize = true
; How sharp. Auto picks 4096 on screens about 2160 pixels tall (4K, 5120 x 2160) and 2048 on
; smaller ones. Set a number to choose yourself: on a smaller screen, 4096 still makes the hair
; smoother if your graphics card has room to spare. Higher costs more graphics memory and frame
; rate, in the menu only.
Size = Auto

[Shadows]
; Sharper shadows on the menu model while the menu is open.
Sharper = true
; How much sharper: 2 = twice the game's shadow detail (recommended; no cost noticed).
; 3 or 4 = sharper still, but a lower frame rate in the menu.
Factor = 2

[Intro]
; Skip the start-up video and the Game Freak logo. The game only allows skipping them from
; the second start on, so on the very first start they still play.
SkipLogos = true
